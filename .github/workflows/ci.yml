name: CI
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, name: gcc, cxx: g++}
          - {os: ubuntu-24.04, name: clang-asan, cxx: clang++, flags: "-fsanitize=address,undefined -fno-sanitize-recover=all"}
          - {os: windows-2022, name: msvc, cxx: cl}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.flags && format('"-DCMAKE_CXX_FLAGS={0}"', matrix.flags) || '' }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  vscode:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npx vsce package --no-dependencies

  # The extension inside VS Code (plan D1): VSCodium, the same editor without Microsoft's
  # services, pinned and headless, against the server built here and a copy of the server's
  # test project.
  vscode-integration:
    runs-on: ubuntu-24.04
    env:
      CODIUM: 1.90.2.24171
    steps:
      - uses: actions/checkout@v4
      - name: Build the server
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target baker-lsp
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: codium
          key: codium-${{ env.CODIUM }}
      - name: Get VSCodium
        run: |
          if [ ! -x codium/codium ]; then
            mkdir -p codium
            curl -sSL "https://github.com/VSCodium/vscodium/releases/download/$CODIUM/VSCodium-linux-x64-$CODIUM.tar.gz" | tar -xz -C codium
          fi
      - name: Run the integration tests
        working-directory: vscode
        env:
          VSCODE_EXECUTABLE: ${{ github.workspace }}/codium/codium
        run: |
          npm ci
          npm run compile
          xvfb-run -a npm run integration

  tree-sitter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tree-sitter-baker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tree-sitter generate && git diff --exit-code src  # src/ matches grammar.js
      - run: npx tree-sitter test --config-path test/config.json

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: clang-format-18 --dry-run --Werror server/src/* server/tests/*.cpp
