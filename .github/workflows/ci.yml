name: CI
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, name: gcc, cxx: g++}
          - {os: ubuntu-24.04, name: clang-asan, cxx: clang++, flags: "-fsanitize=address,undefined -fno-sanitize-recover=all"}
          - {os: windows-2022, name: msvc, cxx: cl}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.flags && format('"-DCMAKE_CXX_FLAGS={0}"', matrix.flags) || '' }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  vscode:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npx vsce package --no-dependencies

  tree-sitter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tree-sitter-baker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tree-sitter generate && git diff --exit-code src  # src/ matches grammar.js
      - run: npx tree-sitter test --config-path test/config.json

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: clang-format-18 --dry-run --Werror server/src/* server/tests/*.cpp
